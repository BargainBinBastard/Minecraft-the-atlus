name: Build

on:
  push:
    branches-ignore: [ci-logs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          set -o pipefail
          ./gradlew build --stacktrace 2>&1 | tee build.log

      - name: Smoke test on a dedicated server
        run: |
          mkdir -p run-smoke && echo "eula=true" > run-smoke/eula.txt
          timeout 900 ./gradlew runSmokeServer --stacktrace 2>&1 | tee smoke.log || true
          grep -q "ALTUS SMOKE TEST PASSED" smoke.log

      - name: Dump Minecraft API signatures (development aid)
        if: always()
        run: |
          JAR=""
          for j in $(find build/moddev ~/.gradle/caches -name "*.jar" 2>/dev/null | grep -iE "neoforge|minecraft" | head -200); do
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/world/level/chunk/ChunkGenerator.class"; then JAR="$j"; break; fi
          done
          echo "jar: $JAR" > api.txt
          if [ -n "$JAR" ] && [ -f api-classes.txt ]; then
            while read -r c; do
              [ -z "$c" ] && continue
              echo "=== $c" >> api.txt
              javap -cp "$JAR" $c >> api.txt 2>&1 || true
            done < api-classes.txt
          fi

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: altus-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Publish the build log and test results to the ci-logs branch so they can be read
      # through the GitHub API without downloading the full Actions logs.
      - name: Publish build log
        if: always() && github.event_name == 'push'
        run: |
          mkdir -p /tmp/ci-logs
          cp build.log /tmp/ci-logs/build.log 2>/dev/null || echo "no build log" > /tmp/ci-logs/build.log
          if [ -f smoke.log ]; then tail -n 400 smoke.log > /tmp/ci-logs/smoke.log; fi
          if [ -f api.txt ]; then cp api.txt /tmp/ci-logs/api.txt; fi
          if [ -f run-smoke/world/altus/history.txt ]; then cp run-smoke/world/altus/history.txt /tmp/ci-logs/smoke-history.txt; fi
          if [ -d run-smoke/crash-reports ]; then cp -r run-smoke/crash-reports /tmp/ci-logs/crash-reports; fi
          if [ -d build/test-results/test ]; then cp -r build/test-results/test /tmp/ci-logs/test-results; fi
          echo "${{ github.sha }} ${{ job.status }}" > /tmp/ci-logs/STATUS
          cd /tmp/ci-logs
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "CI log for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:ci-logs
